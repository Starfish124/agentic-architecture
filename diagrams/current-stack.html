<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Current stack</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Geist',sans-serif;font-size:1.5rem;font-weight:600;
letter-spacing:-.01em;line-height:1.2;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Layer stack · what I run today</p><h1>The stack as it stands</h1>
<svg viewBox="0 0 1000 744" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="current-stack-title current-stack-desc">
<title id="current-stack-title">Current stack</title>
<desc id="current-stack-desc">Eight layers of the stack in use today, from the two machines at the bottom through local inference, retrieval, orchestration and the applications, to the governance plane and the delivery path into the Microsoft tenant.</desc>

<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>

<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

<rect x="152" y="564" width="808" height="60" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>

<text x="152" y="700" fill="#4f5d75" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="start">Layers 00–02 are deliberately boring and interchangeable. Layer 05 is the one that is not bought in, and the one every agent inherits.</text>
