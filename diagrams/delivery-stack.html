<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent delivery stack</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Architecture · how I ship</p><h1>How an agent gets from a prompt to a tenant</h1>

<title id="delivery-stack-title">Agent delivery stack</title>
<desc id="delivery-stack-desc">Claude Code sessions run in parallel Vibe Kanban worktrees onto one repository, which a control room measures on an xyOps schedule and which GitHub carries to a Windows laptop for deployment into the Microsoft tenant.</desc>

<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>

<text x="92" y="421" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">MEASURE</text>

<rect x="376" y="40" width="248" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="500" y="76" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Claude Code sessions</text>
<text x="500" y="92" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">one per system</text>
<rect x="376" y="168" width="248" height="80" rx="6" fill="#f5f5f5"/>

<rect x="64" y="440" width="224" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<rect x="712" y="440" width="224" height="88" rx="6" fill="#f5f5f5"/>

<text x="824" y="624" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">pac CLI, tenant auth</text>
<rect x="352" y="696" width="296" height="80" rx="6" fill="#f5f5f5"/>
<rect x="352" y="696" width="296" height="80" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="500" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Copilot Studio · Dataverse</text>
<text x="500" y="748" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">the tenant</text>
<text x="192" y="552" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">runs the checks</text>
<text x="200" y="428" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">reads the repo, not a slide</text>
<text x="672" y="724" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">push · publish</text>
<text x="40" y="812" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">The Mac has no tenant access, so authoring and deployment are physically separated and GitHub is the only thing that crosses.</text>
</svg>
</div></body></html>
