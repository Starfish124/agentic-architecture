<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Glassbox two-lane routing</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Architecture · glassbox-agents</p><h1>Confidential work cannot reach the cloud lane</h1>
<svg viewBox="0 0 1064 496" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="glassbox-lanes-title glassbox-lanes-desc">
<title id="glassbox-lanes-title">Glassbox two-lane routing</title>
<desc id="glassbox-lanes-desc">A task carries a sensitivity label; the lane router sends it local, sends it cloud, or raises a LaneViolation, and every outcome is appended to the audit chain.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<line x1="184" y1="268" x2="228" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 280,216 V 104 Q 280,96 288,96 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="416" y1="268" x2="512" y2="268" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="436" y="250" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="464" y="259" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PINNED</text>
<path d="M 368,320 V 368 Q 368,376 376,376 H 512" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 728,96 H 916 Q 924,96 924,104 V 208" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="728" y1="268" x2="820" y2="268" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="746" y="250" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="774" y="259" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOGGED</text>
<path d="M 728,376 H 916 Q 924,376 924,368 V 328" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="400" y="88" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">CONFIDENTIAL</text>
<text x="444" y="368" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">PUBLIC</text>
<rect x="40" y="232" width="144" height="72" rx="6" fill="#f5f5f5"/>
<rect x="40" y="232" width="144" height="72" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="112" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A task</text>
<text x="112" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">+ sensitivity</text>
<rect x="232" y="216" width="184" height="104" rx="6" fill="#f5f5f5"/>
<rect x="232" y="216" width="184" height="104" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="324" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LaneRouter</text>
<text x="324" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sensitivity → lane</text>
<rect x="520" y="48" width="208" height="96" rx="6" fill="#f5f5f5"/>
<rect x="520" y="48" width="208" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="624" y="92" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Local lane</text>
<text x="624" y="108" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">vLLM · Ollama · your box</text>
<rect x="520" y="232" width="208" height="72" rx="6" fill="#f5f5f5"/>
<rect x="520" y="232" width="208" height="72" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="624" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">LaneViolation</text>
<text x="624" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">raises — no fallback</text>
<rect x="520" y="328" width="208" height="96" rx="6" fill="#f5f5f5"/>
<rect x="520" y="328" width="208" height="96" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
<text x="624" y="372" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Cloud lane</text>
<text x="624" y="388" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">PII redacted on the way out</text>
<rect x="824" y="216" width="200" height="104" rx="6" fill="#f5f5f5"/>
<rect x="824" y="216" width="200" height="104" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="924" y="264" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Hash-chained audit</text>
<text x="924" y="280" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">verify() fails on any edit</text>
<text x="40" y="464" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">A structural control, not a policy document: the router raises rather than quietly downgrading a confidential task onto a cloud endpoint.</text>
</svg>
</div></body></html>
