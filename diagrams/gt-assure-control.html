<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Assure per-control pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Flowchart · GT Assure</p><h1>What the model decides, and what code decides</h1>
<svg viewBox="0 0 960 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gt-assure-control-title gt-assure-control-desc">
<title id="gt-assure-control-title">GT Assure per-control pipeline</title>
<desc id="gt-assure-control-desc">Per control: a model drafts acceptance criteria, code retrieves documents, and an empty retrieval short-circuits before the second model call.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<line x1="480" y1="80" x2="480" y2="132" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="200" x2="480" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="312" x2="480" y2="336" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 344,384 H 192 Q 184,384 184,392 V 436" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="432" x2="480" y2="476" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="544" x2="480" y2="588" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="656" x2="480" y2="700" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<text x="264" y="376" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">NOTHING</text>
<text x="496" y="460" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">EVIDENCE FOUND</text>
<rect x="360" y="32" width="240" height="48" rx="20" fill="#f5f5f5"/><rect x="360" y="32" width="240" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="480" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">One control</text>
<rect x="344" y="136" width="272" height="64" rx="6" fill="#f5f5f5"/>
<rect x="344" y="136" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="352" y="144" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="378" y="153" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
<text x="480" y="170" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Expected-evidence profile</text>
<text x="480" y="186" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">criteria + probes</text>
<rect x="344" y="248" width="272" height="64" rx="6" fill="#f5f5f5"/>
<rect x="344" y="248" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="352" y="256" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="374" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
<text x="480" y="282" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Retrieve whole documents</text>
<text x="480" y="298" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">merge on best distance</text>
<polygon points="480,336 616,384 480,432 344,384" fill="#f5f5f5"/>
<polygon points="480,336 616,384 480,432 344,384" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="388" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Anything retrieved?</text>
<rect x="48" y="436" width="272" height="64" rx="6" fill="#f5f5f5"/>
<rect x="48" y="436" width="272" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="184" y="464" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Insufficient evidence</text>
<text x="184" y="480" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">second call never happens</text>
<rect x="344" y="480" width="272" height="64" rx="6" fill="#f5f5f5"/>
<rect x="344" y="480" width="272" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="352" y="488" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="378" y="497" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODEL</text>
<text x="480" y="514" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Assess against criteria</text>
<text x="480" y="530" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">must cite the excerpts</text>
<rect x="344" y="592" width="272" height="64" rx="6" fill="#f5f5f5"/>
<rect x="344" y="592" width="272" height="64" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<rect x="352" y="600" width="44" height="12" rx="2" fill="none" stroke="#eb6c36" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="374" y="609" fill="#eb6c36" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
<text x="480" y="626" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Drop citations out of range</text>
<text x="480" y="642" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">uncited → not evidenced</text>
<rect x="336" y="700" width="288" height="48" rx="20" fill="#f5f5f5"/><rect x="336" y="700" width="288" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="480" y="728" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Draft finding + audit entry</text>
<text x="56" y="792" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">A control with no evidence in front of the model is where fabrication starts, so that branch never reaches the model at all.</text>
</svg>
</div></body></html>
