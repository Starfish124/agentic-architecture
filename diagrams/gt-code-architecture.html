<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT-Code architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Architecture · GT-Code</p><h1>A coding agent that never leaves the machine</h1>
<svg viewBox="0 0 1120 440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gt-code-architecture-title gt-code-architecture-desc">
<title id="gt-code-architecture-title">GT-Code architecture</title>
<desc id="gt-code-architecture-desc">Prompt enters a router on a resident 1.5B model, which picks from a three-model local ladder and runs an agent loop; every tool call passes a permission gate.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<rect x="200" y="96" width="200" height="264" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="216" y="100" width="136" height="12" rx="2" fill="#f5f5f5"/>
<text x="284" y="109" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">LOCAL INFERENCE</text>
<rect x="424" y="80" width="656" height="288" rx="8" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
<rect x="440" y="84" width="56" height="12" rx="2" fill="#f5f5f5"/>
<text x="468" y="93" fill="rgba(45,49,66,0.40)" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.14em">AGENT</text>
<line x1="160" y1="160" x2="220" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="162" y="142" width="56" height="12" rx="2" fill="#f5f5f5"/><text x="190" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">PROMPT</text>
<line x1="300" y1="192" x2="300" y2="244" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="376" y1="160" x2="444" y2="160" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="394" y="142" width="32" height="12" rx="2" fill="#f5f5f5"/><text x="410" y="151" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">RUN</text>
<line x1="624" y1="160" x2="676" y2="160" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<line x1="816" y1="160" x2="868" y2="160" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="818" y="142" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="842" y="151" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALLOW</text>
<line x1="536" y1="208" x2="536" y2="264" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="40" y="128" width="120" height="64" rx="6" fill="#f5f5f5"/>
<rect x="40" y="128" width="120" height="64" rx="6" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/>
<text x="100" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">You</text>
<text x="100" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">any folder</text>
<rect x="224" y="128" width="152" height="64" rx="6" fill="#f5f5f5"/>
<rect x="224" y="128" width="152" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="300" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Router</text>
<text x="300" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">resident 1.5B</text>
<rect x="224" y="248" width="152" height="88" rx="6" fill="#f5f5f5"/>
<rect x="224" y="248" width="152" height="88" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<rect x="232" y="256" width="60" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="262" y="265" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">MODELS</text>
<text x="300" y="278" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">tiny  1.5b</text>
<text x="300" y="292" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">fast  8b</text>
<text x="300" y="306" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="middle">brain 14b</text>
<rect x="448" y="112" width="176" height="96" rx="6" fill="#f5f5f5"/>
<rect x="448" y="112" width="176" height="96" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="536" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Agent loop</text>
<text x="536" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">plan · execute · verify</text>
<rect x="680" y="112" width="136" height="96" rx="6" fill="#f5f5f5"/>
<rect x="680" y="112" width="136" height="96" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="748" y="156" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Permission</text>
<text x="748" y="172" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">yes / always / no</text>
<rect x="872" y="112" width="184" height="96" rx="6" fill="#f5f5f5"/>
<rect x="872" y="112" width="184" height="96" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="880" y="120" width="52" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="906" y="129" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">LOCAL</text>
<text x="964" y="162" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Tools</text>
<text x="964" y="178" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">files · shell · office</text>
<rect x="448" y="272" width="176" height="72" rx="6" fill="#f5f5f5"/>
<rect x="448" y="272" width="176" height="72" rx="6" fill="rgba(45,49,66,0.05)" stroke="#4f5d75" stroke-width="1"/>
<text x="536" y="304" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Memory</text>
<text x="536" y="320" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">sqlite + embeddings</text>
<text x="300" y="354" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">routes by cost, not size</text>
<text x="756" y="228" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">denied → nothing runs</text>
<text x="636" y="308" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">recall · remember</text>
<text x="40" y="400" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Ollama on localhost is the only server. No API key, no telemetry, no update check; web tools ship off, so the default is air-gapped.</text>
</svg>
</div></body></html>
