<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT-Code request lifecycle</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Flowchart · GT-Code</p><h1>Where the agent is allowed to stop and ask</h1>
<svg viewBox="0 0 960 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gt-code-lifecycle-title gt-code-lifecycle-desc">
<title id="gt-code-lifecycle-title">GT-Code request lifecycle</title>
<desc id="gt-code-lifecycle-desc">A build request is scored for confidence, routing to a question, a plan or an immediate build; every tool call then passes a permission decision.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<line x1="480" y1="80" x2="480" y2="128" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 340,184 H 164 Q 156,184 156,192 V 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="236" x2="480" y2="292" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 620,184 H 796 Q 804,184 804,192 V 292" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 156,360 V 392 Q 156,400 164,400 H 472" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="360" x2="480" y2="396" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 804,360 V 392 Q 804,400 796,400 H 488" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="404" x2="480" y2="436" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="480" y1="504" x2="480" y2="528" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="620" y1="584" x2="700" y2="584" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="636" y="566" width="48" height="12" rx="2" fill="#f5f5f5"/><text x="660" y="575" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">ALLOW</text>
<line x1="480" y1="636" x2="480" y2="676" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<rect x="460" y="654" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="480" y="663" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">DENY</text>
<line x1="280" y1="584" x2="336" y2="584" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<path d="M 804,552 V 480 Q 804,472 796,472 H 600" fill="none" stroke="#4f5d75" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
<text x="618" y="460" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">next step</text>
<text x="240" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="end">LOW</text>
<text x="496" y="268" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">MEDIUM</text>
<text x="720" y="176" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">HIGH</text>
<rect x="360" y="32" width="240" height="48" rx="20" fill="#f5f5f5"/><rect x="360" y="32" width="240" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="480" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A new build request</text>
<polygon points="480,132 620,184 480,236 340,184" fill="#f5f5f5"/>
<polygon points="480,132 620,184 480,236 340,184" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="180" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">How many readings?</text>
<text x="480" y="196" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">confidence gate</text>
<rect x="56" y="296" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="56" y="296" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="156" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Ask one question</text>
<rect x="380" y="296" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="380" y="296" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Present the plan</text>
<rect x="704" y="296" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="704" y="296" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="804" y="328" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Build now</text>
<circle cx="480" cy="400" r="4" fill="#2d3142"/>
<rect x="368" y="440" width="224" height="64" rx="6" fill="#f5f5f5"/>
<rect x="368" y="440" width="224" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="480" y="472" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Propose a tool call</text>
<rect x="56" y="552" width="224" height="64" rx="6" fill="#f5f5f5"/>
<rect x="56" y="552" width="224" height="64" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="168" y="580" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Destructive command</text>
<text x="168" y="596" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">rm -rf · format · push -f</text>
<polygon points="480,532 620,584 480,636 340,584" fill="#f5f5f5"/>
<polygon points="480,532 620,584 480,636 340,584" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>
<text x="480" y="580" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Permission</text>
<text x="480" y="596" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">yes / always / no</text>
<rect x="704" y="552" width="200" height="64" rx="6" fill="#f5f5f5"/>
<rect x="704" y="552" width="200" height="64" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="804" y="584" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Run it, then verify</text>
<rect x="360" y="680" width="240" height="48" rx="20" fill="#f5f5f5"/><rect x="360" y="680" width="240" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="480" y="708" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Nothing runs</text>
<text x="56" y="780" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">The gate is code, not instruction: a standing grant or /auto skips the prompt, and the destructive-command check overrides both.</text>
</svg>
</div></body></html>
