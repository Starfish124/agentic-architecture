<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">

<title>GT Proposal architecture</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Architecture · GT Proposal</p><h1>The model selects; the code counts</h1>

<desc id="gt-proposal-architecture-desc">A brief routes through model-side comparable selection and drafting, with qualification, pricing, interlocks and approval all computed in code.</desc>

<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">

</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>

<rect x="232" y="120" width="192" height="88" rx="6" fill="#f5f5f5"/>
<rect x="232" y="120" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<text x="328" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">no fee, no hours shown</text>

<rect x="504" y="120" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<text x="600" y="176" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">only from comparables</text>
<rect x="232" y="336" width="192" height="88" rx="6" fill="#f5f5f5"/>
<rect x="232" y="336" width="192" height="88" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>

<text x="328" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">median · range · rate</text>
<rect x="504" y="336" width="192" height="88" rx="6" fill="#f5f5f5"/>
<rect x="504" y="336" width="192" height="88" rx="6" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1"/>

<text x="600" y="392" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">names · citations · figures</text>
<rect x="760" y="336" width="184" height="88" rx="6" fill="#f5f5f5"/>
<rect x="760" y="336" width="184" height="88" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>

<rect x="760" y="120" width="184" height="88" rx="6" fill="#f5f5f5"/>

<text x="866" y="276" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="start">approved</text>
<text x="40" y="492" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">The model is never shown a fee or an hour count when it selects. Every number in the estimate is computed by code from recorded actuals.</text>
