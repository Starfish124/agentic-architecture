<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GT Proposal interlocks</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Instrument Serif',serif;font-size:clamp(1.5rem,2.4vw + .75rem,2rem);
font-weight:400;letter-spacing:-.02em;line-height:1.15;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Flowchart · GT Proposal</p><h1>Three things that stand between a draft and a filed proposal</h1>
<svg viewBox="0 0 960 816" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="gt-proposal-interlocks-title gt-proposal-interlocks-desc">
<title id="gt-proposal-interlocks-title">GT Proposal interlocks</title>
<desc id="gt-proposal-interlocks-desc">A drafted section passes a client-name check, an attribution check and a foreign-figure check; any hit refuses approval outright.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<line x1="416" y1="80" x2="416" y2="124" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="416" y1="184" x2="416" y2="232" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="416" y1="328" x2="416" y2="392" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="416" y1="488" x2="416" y2="552" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<line x1="416" y1="648" x2="416" y2="700" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
<path d="M 552,280 H 780 Q 788,280 788,288 V 388" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="620" y="272" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FOUND</text>
<line x1="552" y1="440" x2="664" y2="440" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<rect x="588" y="422" width="40" height="12" rx="2" fill="#f5f5f5"/><text x="608" y="431" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">NONE</text>
<path d="M 552,600 H 780 Q 788,600 788,592 V 492" fill="none" stroke="#eb6c36" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
<text x="620" y="592" fill="#eb6c36" font-size="8" font-family="'Geist Mono', monospace" text-anchor="middle">FOUND</text>
<text x="432" y="372" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">CLEAN</text>
<text x="432" y="532" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">CITED</text>
<text x="432" y="692" fill="#4f5d75" font-size="8" font-family="'Geist Mono', monospace" text-anchor="start">TRACEABLE</text>
<rect x="304" y="32" width="224" height="48" rx="20" fill="#f5f5f5"/><rect x="304" y="32" width="224" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="416" y="60" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A drafted section</text>
<rect x="296" y="128" width="240" height="56" rx="6" fill="#f5f5f5"/>
<rect x="296" y="128" width="240" height="56" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<rect x="304" y="136" width="44" height="12" rx="2" fill="none" stroke="#4f5d75" stroke-opacity="0.4" stroke-width="0.8"/>
<text x="326" y="145" fill="#4f5d75" font-size="7" font-family="'Geist Mono', monospace" text-anchor="middle" letter-spacing="0.08em">CODE</text>
<text x="416" y="158" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Strip citation tags</text>
<text x="416" y="174" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">they carry the old name</text>
<polygon points="416,232 552,280 416,328 280,280" fill="#f5f5f5"/>
<polygon points="416,232 552,280 416,328 280,280" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="416" y="276" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A past client name?</text>
<text x="416" y="292" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">full · legal · short form</text>
<polygon points="416,392 552,440 416,488 280,440" fill="#f5f5f5"/>
<polygon points="416,392 552,440 416,488 280,440" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="416" y="436" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Any citation at all?</text>
<text x="416" y="452" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">attribution check</text>
<polygon points="416,552 552,600 416,648 280,600" fill="#f5f5f5"/>
<polygon points="416,552 552,600 416,648 280,600" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
<text x="416" y="596" fill="#2d3142" font-size="11" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">A figure from nowhere?</text>
<text x="416" y="612" fill="#4f5d75" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="middle">not in brief or extract</text>
<rect x="664" y="392" width="248" height="96" rx="6" fill="#f5f5f5"/>
<rect x="664" y="392" width="248" height="96" rx="6" fill="rgba(235,108,54,0.05)" stroke="rgba(235,108,54,0.50)" stroke-width="1" stroke-dasharray="4,3"/>
<text x="788" y="436" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Approval refused</text>
<text x="788" y="452" fill="#4f5d75" font-size="9" font-family="'Geist Mono', monospace" text-anchor="middle">not a warning — refused</text>
<rect x="304" y="704" width="224" height="48" rx="20" fill="#f5f5f5"/><rect x="304" y="704" width="224" height="48" rx="20" fill="rgba(79,93,117,0.10)" stroke="#7a8399" stroke-width="1"/><text x="416" y="732" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist', sans-serif" text-anchor="middle">Approvable</text>
<text x="56" y="792" fill="#4f5d75" font-size="13" font-style="italic" font-family="'Instrument Serif', serif" text-anchor="start">Matching is exact on purpose. A similarity threshold is a dial for how often a confidentiality check fails quietly.</text>
</svg>
</div></body></html>
