<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Guardrail layers</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Geist',sans-serif;font-size:1.5rem;font-weight:600;
letter-spacing:-.01em;line-height:1.2;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Layer stack · guardrails</p><h1>Prompt engineering is layer zero, not the guardrail</h1>
<svg viewBox="0 0 1000 664" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="guardrails-title guardrails-desc">
<title id="guardrails-title">Guardrail layers</title>
<desc id="guardrails-desc">Seven guardrail layers from the system prompt down to the evaluation gate, with the prompt layer marked as the only persuadable one.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<text x="112" y="96" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">prompt</text>
<text x="112" y="560" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">code</text>
<path d="M 104,112 V 540" fill="none" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="152" y="88" width="808" height="64" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="172" y="124" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">00</text>
<text x="240" y="125" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">The system prompt</text>
<text x="940" y="124" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">the only layer that can be argued with</text>
<rect x="152" y="160" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="196" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
<text x="240" y="197" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Retrieval boundary</text>
<text x="940" y="196" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">approved sources only; nothing found → no call</text>
<rect x="152" y="232" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="268" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
<text x="240" y="269" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Capability scope</text>
<text x="940" y="268" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">which tools exist for this agent at all</text>
<rect x="152" y="304" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="340" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
<text x="240" y="341" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Deterministic interlocks</text>
<text x="940" y="340" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">uncited claim downgraded · invented reference dropped</text>
<rect x="152" y="376" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="412" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">04</text>
<text x="240" y="413" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Human approval</text>
<text x="940" y="412" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">unapproved work cannot leave the tool</text>
<rect x="152" y="448" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="484" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">05</text>
<text x="240" y="485" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Audit</text>
<text x="940" y="484" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">append-only, hash-chained, independently verifiable</text>
<rect x="152" y="520" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="556" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">06</text>
<text x="240" y="557" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Evaluation gate</text>
<text x="940" y="556" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">answer and chain must both pass before release</text>
<text x="152" y="624" fill="#4f5d75" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="start">A prompt can describe the behaviour I want. It cannot enforce a permission, prove what happened, or refuse on my behalf.</text>
</svg>
</div></body></html>
