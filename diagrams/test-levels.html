<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agent test levels</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--paper:#f5f5f5;--ink:#2d3142;--muted:#4f5d75}
body{font-family:'Geist',system-ui,sans-serif;background:var(--paper);color:var(--ink);
min-height:100vh;display:flex;align-items:center;justify-content:center;padding:3rem 2rem}
.frame{max-width:1200px;width:100%}
.eyebrow{font-family:'Geist Mono',monospace;font-size:.66rem;font-weight:500;
letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:.5rem}
h1{font-family:'Geist',sans-serif;font-size:1.5rem;font-weight:600;
letter-spacing:-.01em;line-height:1.2;margin-bottom:1.5rem}
svg{width:100%;display:block}
</style></head>
<body><div class="frame"><p class="eyebrow">Layer stack · evaluation</p><h1>Where an agent gets tested, and what each level catches</h1>
<svg viewBox="0 0 1000 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="test-levels-title test-levels-desc">
<title id="test-levels-title">Agent test levels</title>
<desc id="test-levels-desc">Four test levels from interlock unit tests with no tenant on every pull request, through a nightly golden-set run gated on pass rate, to smoke tests in the deployment environment.</desc>
<defs>
<pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
<circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/></pattern>
<marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
<marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/></marker>
<marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
<polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="100%" height="100%" fill="#f5f5f5"/>
<rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>
<text x="112" y="96" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">cheap, constant</text>
<text x="112" y="344" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" text-anchor="end">costly, rare</text>
<path d="M 104,112 V 324" fill="none" stroke="#7a8399" stroke-width="1" marker-end="url(#arrow)"/>
<rect x="152" y="88" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="124" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">00</text>
<text x="240" y="125" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">No tenant, every PR</text>
<text x="940" y="124" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">interlocks · mocked connectors · frozen corpus</text>
<rect x="152" y="160" width="808" height="64" rx="4" fill="rgba(235,108,54,0.08)" stroke="#eb6c36" stroke-width="1.2"/>
<text x="172" y="196" fill="#eb6c36" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">01</text>
<text x="240" y="197" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">No tenant, nightly</text>
<text x="940" y="196" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">golden set × N runs · pass rate · chain verifies</text>
<rect x="152" y="232" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="268" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">02</text>
<text x="240" y="269" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Test environment</text>
<text x="940" y="268" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">connectors · permissions · one real path per agent</text>
<rect x="152" y="304" width="808" height="64" rx="4" fill="#ffffff" stroke="rgba(45,49,66,0.12)" stroke-width="0.8"/>
<text x="172" y="340" fill="#7a8399" font-size="8.5" font-family="'Geist Mono', monospace" letter-spacing="0.14em">03</text>
<text x="240" y="341" fill="#2d3142" font-size="14" font-weight="600" font-family="'Geist', sans-serif">Deployment environment</text>
<text x="940" y="340" fill="#4f5d75" font-size="9.5" font-family="'Geist Mono', monospace" text-anchor="end">smoke only — never where something is first discovered</text>
<text x="152" y="408" fill="#4f5d75" font-size="11.5" font-family="'Geist', sans-serif" text-anchor="start">Level 01 is the one that does not exist yet, and the one that decides whether any of the rest is a gate or a ritual.</text>
</svg>
</div></body></html>
